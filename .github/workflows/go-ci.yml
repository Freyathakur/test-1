name: Go CI

on:
  push:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]
  pull_request:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
