name: Python CI

on:
  push:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]
  pull_request:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q
