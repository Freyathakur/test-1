name: Config CI

on:
  push:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]
  pull_request:
    branches: [main, "smoke/**", "cicd-copilot/**", "eval/**"]

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate config/settings.json
        run: python -c "import json; json.load(open('config/settings.json')); print('config/settings.json is valid')"
